###############################################################################
###############################################################################

# Quicker Esc response in Vim
# https://stackoverflow.com/questions/13021196/how-do-i-get-vim-to-recognize-esc-key-faster
# set -s escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Default shell
set-option -g default-shell /bin/zsh

# No bells at all
set -g bell-action none

# Lock after 15 minutes
set -g lock-after-time 1800

# Don't keep windows around after they exit
set -g remain-on-exit off

# Automatic window renaming based on shell hooks
set -g automatic-rename on
set -g allow-rename on

# Turn on xterm-keys so that additional function keys get escape sequences
set -g xterm-keys on

# Change the prefix key to Alt-b
set -g prefix M-n

bind M-b send-prefix
bind M-n send-prefix

bind s run 'python3 ~/Repos/dotfiles/.tmux/shift_windows_left.py'

# Vim-line pane navigatione
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Pane resizing (prefix + Shift-hjkl, repeatable)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Pane resizing with arrows (prefix + arrows, repeatable).
# Overrides tmux's default prefix+arrow select-pane; M-arrow above already selects.
bind -r Left  resize-pane -L 2
bind -r Down  resize-pane -D 2
bind -r Up    resize-pane -U 2
bind -r Right resize-pane -R 2

# Some extra key bindings to select higher numbered windows
bind F1 selectw -t:10
bind F2 selectw -t:11
bind F3 selectw -t:12
bind F4 selectw -t:13
bind F5 selectw -t:14
bind F6 selectw -t:15
bind F7 selectw -t:16
bind F8 selectw -t:17
bind F9 selectw -t:18
bind F10 selectw -t:19
bind F11 selectw -t:20
bind F12 selectw -t:21

# Keys to toggle monitoring activity in a window, and synchronize-panes
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Split/new pane: prompt to SSH if source pane is SSH'd into a remote host (default: no)
bind '"' run-shell 'host="$(tmux show-options -pqv @ssh_host)"; tmux split-window -c "#{pane_current_path}"; [ -n "$host" ] && tmux confirm-before -p "SSH into $host? (y/n)" "send-keys \"ssh $host\" Enter" || true'
bind %   run-shell 'host="$(tmux show-options -pqv @ssh_host)"; tmux split-window -h -c "#{pane_current_path}"; [ -n "$host" ] && tmux confirm-before -p "SSH into $host? (y/n)" "send-keys \"ssh $host\" Enter" || true'
bind c   new-window      -c "~"

# Rename in a popup rather than on the status line. tmux's command-prompt
# overwrites only the left of the status bar, so the window list stays visible
# to the right of the cursor and it reads as typing on top of it.
bind , run-shell 'tmux display-popup -E -w 46 -h 3 -T "#[align=centre] rename window " ~/.tmux/rename.sh window "#{window_id}"'
bind $ run-shell 'tmux display-popup -E -w 46 -h 3 -T "#[align=centre] rename session " ~/.tmux/rename.sh session "#{session_name}"'

# Unbind v for visual block multi-line insert in Vim
unbind v

###############################################################################
# Appearance
#
# A transparent status line: the terminal background shows through, the active
# window is the only bright thing on screen, and everything else is grey.
# Defined here rather than through a theme plugin so there is one place to read.
###############################################################################

# True colour, so pane contents render the palette their program intended
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -ga terminal-features ",*:RGB"

# The bar paints an explicit background so iTerm2's transparency, which only
# applies to the default background colour, never shows through it. Same colour
# as window-active-style below, so the bar reads as part of the active pane.
set -g status-style bg=colour234,fg=colour244
set -g status-position bottom
set -g status-justify left
# status-interval is left to tmux-sensible, which sets 5 after this file loads

# Session name, dim, bracketed so it reads as its own field rather than
# running into the window list. An unnamed session takes up no room at all
# rather than leaving a blank gap before the window list.
set -g status-left "#{?#{==:#S,}, , #[fg=colour109][#S]#[fg=colour244]   }"
# Two wider than the name budget it used to hold, so the brackets don't
# cost a session name its last two characters.
set -g status-left-length 26

# Battery (omitted on machines without one) and the clock. Both sit a few steps
# brighter than the window list: at colour240 the battery was 2.5:1 against the
# terminal background and read as smudge rather than text.
set -g status-right "#[fg=colour248]#(~/.tmux/battery.sh)#[fg=colour250]  %H:%M "
set -g status-right-length 40

# Window list: inactive recedes, active is the one bold thing
# Names are capped so one auto-renamed window cannot crowd out the rest.
set -g window-status-format "#[fg=colour240]#I #[fg=colour244]#{=24:window_name}"
set -g window-status-current-format "#[fg=colour109]#I #[fg=colour255,bold]#{=24:window_name}"
set -g window-status-separator "   "

# Alerts tint the name instead of inverting it into a block
set -g window-status-activity-style fg=colour109,none
set -g window-status-bell-style fg=colour174,none

# Hairline pane borders
set -g pane-border-style fg=colour237
set -g pane-active-border-style fg=colour109
set -g pane-border-lines single
set -g display-panes-colour colour240
set -g display-panes-active-colour colour109

# Unfocused panes keep the terminal's default background, so iTerm2's
# transparency shows through them; the active pane paints an explicit colour
# and stays opaque. Needs "Only the default BG color uses transparency" on in
# the iTerm2 profile, or both panes go see-through and the contrast is lost.
set -g window-style 'bg=default'
set -g window-active-style 'bg=colour234'

# Prompts, messages, and copy-mode selection, in the same muted register
set -g message-style bg=colour236,fg=colour252
set -g message-command-style bg=colour236,fg=colour252
set -g popup-style bg=colour236,fg=colour252
set -g popup-border-style fg=colour240
set -g popup-border-lines rounded
set -g mode-style bg=colour238,fg=colour255
set -g clock-mode-colour colour109
set -g clock-mode-style 24

# Plugins
#
# Installed by tpm into ~/.tmux/plugins, which is gitignored. On a new machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   tmux source-file ~/.tmux.conf && ~/.tmux/plugins/tpm/bin/install_plugins
# Thereafter prefix + I installs anything added below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save every 15 minutes and restore the last save when the tmux server starts,
# so a reboot comes back to the same windows, panes, and working directories.
# Resurrect keys sessions by name, so a session must have one; an empty name
# writes a save file it cannot restore from.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
